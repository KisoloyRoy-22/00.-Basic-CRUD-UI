<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-submit {
            background-color: #667eea;
            color: white;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
        }
        .btn-submit:hover {
            background-color: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .table-section {
            margin-top: 40px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background-color: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        .btn-edit {
            background-color: #ffc107;
            color: #333;
            padding: 6px 12px;
            font-size: 13px;
        }
        .btn-edit:hover {
            background-color: #ffb300;
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
            padding: 6px 12px;
            font-size: 13px;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }
        .empty-message {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Employee Management</h1>
        
        <form id="employeeForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="position">Position</label>
                    <input type="text" id="position" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" required>
                </div>
                <div class="form-group">
                    <label for="salary">Salary</label>
                    <input type="number" id="salary" required>
                </div>
            </div>
            
            <button type="submit" class="btn-submit">Add Employee</button>
        </form>

        <div class="table-section">
            <h2 style="color: #333; margin-bottom: 10px;">Employee List</h2>
            <div id="employeeTableContainer">
                <div class="empty-message">No employees added yet.</div>
            </div>
        </div>
    </div>

    <script>
        let employees = [];
        let editingId = null;

        const form = document.getElementById('employeeForm');
        const firstNameInput = document.getElementById('firstName');
        const lastNameInput = document.getElementById('lastName');
        const emailInput = document.getElementById('email');
        const positionInput = document.getElementById('position');
        const departmentInput = document.getElementById('department');
        const salaryInput = document.getElementById('salary');
        const tableContainer = document.getElementById('employeeTableContainer');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const employee = {
                id: editingId || Date.now(),
                firstName: firstNameInput.value,
                lastName: lastNameInput.value,
                email: emailInput.value,
                position: positionInput.value,
                department: departmentInput.value,
                salary: salaryInput.value
            };

            if (editingId) {
                const index = employees.findIndex(emp => emp.id === editingId);
                employees[index] = employee;
                editingId = null;
                document.querySelector('.btn-submit').textContent = 'Add Employee';
            } else {
                employees.push(employee);
            }

            form.reset();
            renderTable();
        });

        function editEmployee(id) {
            const employee = employees.find(emp => emp.id === id);
            if (employee) {
                firstNameInput.value = employee.firstName;
                lastNameInput.value = employee.lastName;
                emailInput.value = employee.email;
                positionInput.value = employee.position;
                departmentInput.value = employee.department;
                salaryInput.value = employee.salary;
                editingId = id;
                document.querySelector('.btn-submit').textContent = 'Update Employee';
                firstNameInput.focus();
            }
        }

        function deleteEmployee(id) {
            if (confirm('Are you sure you want to delete this employee?')) {
                employees = employees.filter(emp => emp.id !== id);
                renderTable();
            }
        }

        function renderTable() {
            if (employees.length === 0) {
                tableContainer.innerHTML = '<div class="empty-message">No employees added yet.</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Position</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            employees.forEach(emp => {
                html += `
                    <tr>
                        <td>${emp.firstName}</td>
                        <td>${emp.lastName}</td>
                        <td>${emp.email}</td>
                        <td>${emp.position}</td>
                        <td>${emp.department}</td>
                        <td>$${parseFloat(emp.salary).toLocaleString()}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-edit" onclick="editEmployee(${emp.id})">Edit</button>
                                <button class="btn-delete" onclick="deleteEmployee(${emp.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            tableContainer.innerHTML = html;
        }

        renderTable();
    </script>
</body>
</html>
